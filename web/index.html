<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5-Stack Tracker</title>
<meta name="description" content="Tracks your Valorant 5-stack's games, per-agent and per-map stats, and turns them into betting lines for the next game.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233987e5'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3E5S%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">5S</span>
    <div>
      <h1>5-Stack Tracker</h1>
      <div class="sub" id="team-record">Loading…</div>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#overview" data-view="overview">Overview</a>
    <a href="#players" data-view="players">Players</a>
    <a href="#forecasts" data-view="forecasts">Forecasts</a>
    <a href="#viz" data-view="viz">Visualizations</a>
    <a href="#odds" data-view="odds">Odds &amp; Bets</a>
    <a href="#bettors" data-view="bettors">Bettors</a>
    <a href="#matches" data-view="matches">Matches</a>
    <a href="#setup" data-view="setup">Setup</a>
  </nav>
  <div class="topbar-right">
    <div class="status-pill" id="status-pill"><span class="dot"></span>Connecting…</div>
    <button id="sync-btn" class="btn" disabled>Sync now</button>
    <a id="logout-btn" class="btn ghost hidden" href="/logout">Log out</a>
    <button id="theme-btn" class="btn ghost icon" title="Switch theme: dark, light, Greg Mode" aria-label="Switch theme">◐</button>
  </div>
</header>
<div id="banner" class="banner hidden" role="status"></div>
<main id="view" class="container"><div class="loading">Loading…</div></main>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="/viz.js"></script>
<script src="/bets.js"></script>
<script src="/recap.js"></script>
<script src="/app.js"></script>
</body>
</html>
